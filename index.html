<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untangle</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>

    <button id="ResetButton" style="position: absolute; top: 10px; left: 10px; z-index: 1;">
        Reset
    </button>

    <button id="SecondActionButton" style="position: absolute; top: 10px; left: 80px; z-index: 1;">
        Show Solution
    </button>

    <script src="main.js"></script>
</body>

</html>
